"$schema" = "https://starship.rs/config-schema.json"

add_newline = false
command_timeout = 700
palette = "autopr"
right_format = "$cmd_duration"
scan_timeout = 20

format = """
$directory\
$git_branch\
$git_status\
$status\
$character"""

[palettes.autopr]
accent = "#C4B5FD"
amber = "#D6B35F"
dim = "#5C5C5C"
ink = "#D8D8D8"
muted = "#8C8C8C"
red = "#FF7B7B"

[character]
error_symbol = " [>](fg:red) "
success_symbol = " [>](fg:accent) "
vimcmd_symbol = " [<](fg:accent) "

[cmd_duration]
format = "[$duration](fg:dim)"
min_time = 2000
show_milliseconds = false

[directory]
fish_style_pwd_dir_length = 1
format = "[$path](fg:ink)"
home_symbol = "~"
read_only = " ro"
truncate_to_repo = false
truncation_length = 3
truncation_symbol = "../"

[git_branch]
format = " [$branch](fg:muted)"
truncation_length = 28
truncation_symbol = "..."

[git_status]
ahead = ">"
behind = "<"
conflicted = "x"
deleted = "-"
diverged = "<>"
format = " [$all_status$ahead_behind](fg:amber)"
modified = "!"
renamed = "r"
staged = "+"
stashed = "$"
untracked = "?"

[status]
disabled = false
format = " [$status](fg:red)"
