"$schema" = "https://starship.rs/config-schema.json"

add_newline = false
command_timeout = 700
palette = "autopr"
right_format = "$cmd_duration"
scan_timeout = 20

format = """
$character\
$directory\
$git_branch\
$git_status\
$status"""

[palettes.autopr]
amber = "#F2C66D"
cyan = "#9EE7E5"
dim = "#68646F"
green = "#83D787"
ink = "#E9E5ED"
muted = "#9D97A3"
red = "#F5796C"
rose = "#F28BA8"

[character]
error_symbol = "[➜](bold red) "
success_symbol = "[➜](bold green) "
vimcmd_symbol = "[❮](bold cyan) "

[cmd_duration]
format = "[$duration](fg:dim)"
min_time = 2000
show_milliseconds = false

[directory]
fish_style_pwd_dir_length = 1
format = "[$path](bold cyan)"
home_symbol = "~"
read_only = " ro"
truncate_to_repo = false
truncation_length = 3
truncation_symbol = "../"

[git_branch]
format = " [git:](fg:ink)[(](fg:ink)[$branch](bold rose)[)](fg:ink)"
truncation_length = 28
truncation_symbol = "..."

[git_status]
ahead = ">"
behind = "<"
conflicted = "x"
deleted = "-"
diverged = "<>"
format = " [$all_status$ahead_behind](fg:amber)"
modified = "!"
renamed = "r"
staged = "+"
stashed = "$"
untracked = "?"

[status]
disabled = false
format = " [$status](fg:red)"
