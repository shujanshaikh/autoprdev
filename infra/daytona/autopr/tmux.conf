# AutoPR Daytona tmux profile.
#
# Tmux remains opt-in: run `work` from zsh to create or attach to the shared
# AutoPR session.

set -g mouse on
set -g history-limit 50000

# Use tmux's dedicated terminfo entry inside panes. Advertise RGB only for
# compatible xterm-256color clients rather than replacing their capabilities
# with broad terminal overrides.
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"

# One-based windows and panes keep the two index schemes predictable.
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# A short delay keeps Escape responsive while preserving prefix key sequences.
set -s escape-time 10
set -g focus-events on

# Let tmux copies use a terminal's native clipboard integration (for example,
# OSC 52) without depending on pbcopy, xclip, or another host-specific command.
set -g set-clipboard external

# Preserve the active pane's working directory for new workspaces.
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# A compact status line using the same restrained palette as the AutoPR prompt.
set -g status-position bottom
set -g status-interval 5
set -g status-left-length 32
set -g status-right-length 16
set -g status-style "bg=default,fg=#9D97A3"
set -g status-left "#[fg=#83D787,bold] #S #[fg=#68646F]│"
set -g status-right "#[fg=#68646F]│ #[fg=#9EE7E5]%H:%M "
setw -g window-status-separator ""
setw -g window-status-format " #[fg=#9D97A3]#I:#W "
setw -g window-status-current-format " #[fg=#F28BA8,bold]#I:#W "

set -g pane-border-style "fg=#68646F"
set -g pane-active-border-style "fg=#9EE7E5"
set -g message-style "bg=#9EE7E5,fg=black"
setw -g mode-style "bg=#9EE7E5,fg=black"
